<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Craveman Field Sales - E Balakrishna</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @media print {
      body * { visibility: hidden; }
      #printableSlip, #printableSlip * { visibility: visible; }
      #printableSlip {
        position: absolute; left: 0; top: 0; width: 100%; max-width: 80mm;
        margin: 0 auto; padding: 10px; background: white; color: black; font-family: monospace;
      }
      .no-print { display: none !important; }
    }
  </style>
</head>
<body class="bg-slate-100 p-3 max-w-md mx-auto text-slate-800 font-sans pb-28">

  <!-- OFFICIAL CRAVEMAN HEADER -->
  <div class="bg-gradient-to-b from-[#1b1c6e] via-[#21237a] to-[#161758] text-white p-4 rounded-3xl shadow-xl mb-3 text-center relative border border-blue-900">
    <h1 class="text-2xl font-black italic tracking-wide text-white uppercase leading-none">
      <span class="text-[#e2231a] drop-shadow-[0_1px_0_#ffffff]">CRAVEMAN</span>
      <span class="text-[9px] not-italic font-bold align-top text-white ml-0.5 border border-white rounded-full px-0.5">®</span>
    </h1>
    <div class="inline-block bg-[#48a528] text-white text-[9px] font-black px-3 py-0.5 rounded-full uppercase mt-1">
      WE CARE FOR YOUR CRAVINGS
    </div>
    <div class="mt-2 pt-2 border-t border-white/20 flex justify-between items-center text-[11px] px-1">
      <span class="font-bold text-amber-300">Officer: E Balakrishna</span>
      <span class="bg-emerald-500/30 text-emerald-200 px-2 py-0.5 rounded-md font-semibold text-[10px]">Adoni Beat 1</span>
    </div>
  </div>

  <!-- 1. MANDATORY ATTENDANCE & SELFIE PANEL -->
  <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 mb-3 space-y-3">
    <div class="flex justify-between items-center border-b pb-2">
      <div class="flex items-center gap-1.5">
        <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
        <span class="text-xs font-black text-slate-700 uppercase tracking-wide">Duty Attendance (Mandatory)</span>
      </div>
      <span id="dutyBadge" class="text-[10px] font-bold text-rose-600 bg-rose-50 px-2 py-0.5 rounded-full border border-rose-200">
        NOT PUNCHED
      </span>
    </div>

    <!-- Direct Clickable Native Camera Label -->
    <label for="selfieInput" class="border-2 border-dashed border-amber-400 hover:border-amber-500 rounded-2xl p-4 text-center bg-amber-50/40 block cursor-pointer active:scale-98 transition">
      <!-- Input file directly opened by browser label -->
      <input type="file" id="selfieInput" accept="image/*" capture="user" onchange="previewSelfie(event)" class="hidden">
      
      <div id="selfiePlaceholder" class="py-2">
        <div class="w-12 h-12 mx-auto mb-2 rounded-full bg-amber-100 text-amber-700 flex items-center justify-center text-xl shadow-sm">
          📸
        </div>
        <p class="text-xs font-black text-slate-800 uppercase tracking-wide">Click to Take Selfie (Required)</p>
        <p class="text-[10px] text-slate-500 mt-0.5">Punch IN camera open hone ke baad enable hoga</p>
      </div>

      <div id="selfiePreviewBox" class="hidden">
        <img id="selfieImg" src="" alt="Selfie" class="w-24 h-24 object-cover rounded-2xl border-2 border-emerald-500 mx-auto shadow-md">
        <span class="text-blue-600 text-xs font-bold block mt-1.5 underline">Change / Retake Selfie</span>
      </div>
    </label>

    <!-- Punch In / Out Actions -->
    <div class="grid grid-cols-2 gap-2 pt-1">
      <button id="punchInBtn" type="button" onclick="handlePunch('IN')" disabled class="bg-slate-200 text-slate-400 font-bold py-3 rounded-xl text-xs shadow transition cursor-not-allowed">
        📍 Punch IN (Start)
      </button>
      <button id="punchOutBtn" type="button" onclick="handlePunch('OUT')" disabled class="bg-slate-200 text-slate-400 font-bold py-3 rounded-xl text-xs shadow transition cursor-not-allowed">
        🏁 Punch OUT (End)
      </button>
    </div>
  </div>

  <!-- LOCKED CONTAINER: Jab tak Punch IN nahi hoga, tab tak lock rahega -->
  <div id="lockedAppContainer" class="opacity-30 pointer-events-none transition-all duration-300 space-y-3">

    <!-- GPS STATUS -->
    <div class="bg-white p-3 rounded-2xl shadow-sm border border-slate-200 flex items-center justify-between text-xs">
      <div class="flex items-center gap-2">
        <span class="w-2.5 h-2.5 rounded-full bg-emerald-500"></span>
        <span class="font-bold text-slate-700">GPS:</span>
        <span id="gpsStatusText" class="text-slate-500 font-mono text-[11px]">15.63, 77.27</span>
      </div>
      <button type="button" onclick="refreshGPSLocation()" class="text-[11px] font-bold text-blue-700 bg-blue-50 px-2.5 py-1 rounded-lg border border-blue-100">
        Refresh GPS
      </button>
    </div>

    <!-- OUTLET & VISIT TYPE -->
    <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 space-y-3">
      <div>
        <label class="text-xs font-bold text-slate-600 uppercase">Shop / Outlet Name</label>
        <input type="text" id="customShopName" placeholder="Enter shop name here..." class="w-full border border-slate-300 p-3 rounded-xl text-sm bg-slate-50 font-semibold mt-1 outline-none focus:ring-2 focus:ring-amber-500">
      </div>

      <div>
        <label class="text-xs font-bold text-slate-600 uppercase">Action Type</label>
        <div class="grid grid-cols-2 gap-2 mt-1.5">
          <button type="button" id="btnTypeOrder" onclick="setActionType('order')" class="py-2.5 rounded-xl border-2 border-amber-500 bg-amber-50 text-slate-900 font-bold text-xs flex items-center justify-center gap-1">
            <i class="fa-solid fa-cart-shopping text-amber-600"></i> Order Booked
          </button>
          <button type="button" id="btnTypeVisit" onclick="setActionType('visit')" class="py-2.5 rounded-xl border-2 border-transparent bg-slate-100 text-slate-600 font-semibold text-xs flex items-center justify-center gap-1">
            <i class="fa-solid fa-store"></i> Only Visit
          </button>
        </div>
      </div>

      <!-- No Order Box -->
      <div id="noOrderReasonBox" class="hidden space-y-2 pt-2 border-t">
        <label class="text-xs font-bold text-slate-600 uppercase">Reason for No Order</label>
        <select id="noOrderReason" class="w-full border border-slate-300 p-2.5 rounded-xl text-xs bg-slate-50 font-semibold">
          <option value="Sufficient Stock Available">Sufficient Stock Available</option>
          <option value="Shop Was Closed">Shop Was Closed</option>
          <option value="Pending Payment Issue">Pending Payment Issue</option>
          <option value="Owner Not Available">Owner Not Available</option>
        </select>
        <button type="button" id="btnSyncVisit" onclick="submitVisitOnly()" class="w-full bg-slate-900 text-amber-400 font-bold py-3 rounded-xl text-xs shadow flex items-center justify-center gap-2">
          <i class="fa-solid fa-cloud-arrow-up"></i>
          <span>Save Visit to Sheet</span>
        </button>
      </div>
    </div>

    <!-- PRODUCTS CATALOG -->
    <div id="orderBookingSection" class="space-y-3">
      <div class="bg-white p-3 rounded-2xl shadow-sm border border-slate-200">
        <input id="searchInput" type="text" oninput="filterProducts()" placeholder="🔍 Search ice cream flavour..." 
          class="w-full p-2.5 rounded-xl border border-slate-200 text-xs outline-none bg-slate-50 font-medium">
      </div>

      <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200">
        <div class="flex justify-between items-center border-b pb-2 mb-2">
          <h2 class="font-bold text-xs text-slate-700 uppercase">Ice Cream Flavours (Boxes)</h2>
          <span class="text-[10px] bg-emerald-100 text-emerald-800 font-bold px-2 py-0.5 rounded-full">20% Outlet Margin</span>
        </div>
        <div id="productList" class="space-y-2.5 divide-y divide-slate-100 max-h-72 overflow-y-auto pr-1"></div>
      </div>

      <!-- Billing Box -->
      <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 space-y-2 text-xs font-bold text-slate-600">
        <div class="flex justify-between items-center">
          <span>Total Boxes:</span>
          <span class="text-purple-700 text-base font-black" id="totalBoxCount">0</span>
        </div>
        <div class="flex justify-between items-center pt-2 border-t text-sm font-black text-slate-900">
          <span>Invoice Amount:</span>
          <span class="text-blue-700 text-lg">₹ <span id="grandTotal">0</span></span>
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="space-y-2 pt-1">
        <button type="button" id="btnSyncOrder" onclick="submitOrderToSheet()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-black py-3.5 rounded-2xl shadow-lg transition flex items-center justify-center gap-2 text-sm active:scale-95">
          <i class="fa-solid fa-cloud-arrow-up text-lg"></i>
          <span>Book & Sync to Live RSM</span>
        </button>

        <button type="button" onclick="shareToWhatsApp()" class="w-full bg-slate-900 text-emerald-400 font-bold py-3 rounded-2xl shadow flex items-center justify-center gap-2 text-xs">
          <i class="fa-brands fa-whatsapp text-base"></i> Share Slip on WhatsApp
        </button>
      </div>
    </div>

  </div>

  <script>
    const SHEETDB_URL = "https://sheetdb.io/api/v1/pfa3wfno58xy9?sheet=Live_Sales_Log";

    const products = [
      { id: 1, name: "Vanilla Cup 50ml", rate: 8, boxUnits: 40 },
      { id: 2, name: "Strawberry Cup 50ml", rate: 8, boxUnits: 40 },
      { id: 3, name: "Chocolate Cup 100ml", rate: 16, boxUnits: 30 },
      { id: 4, name: "Butterscotch Cup 100ml", rate: 20, boxUnits: 30 },
      { id: 5, name: "Mango Candy 35ml", rate: 8, boxUnits: 50 },
      { id: 6, name: "Orange Bar 40ml", rate: 8, boxUnits: 50 },
      { id: 7, name: "Choco Bar 60ml", rate: 16, boxUnits: 30 },
      { id: 8, name: "Kulfi Stick 50ml", rate: 16, boxUnits: 30 },
      { id: 9, name: "Mini Cone Vanilla 40ml", rate: 12, boxUnits: 30 },
      { id: 10, name: "Medium Cone Chocolate 70ml", rate: 28, boxUnits: 20 },
      { id: 11, name: "Blackcurrant Cone 70ml", rate: 32, boxUnits: 20 },
      { id: 12, name: "Cassata Slice 100ml", rate: 32, boxUnits: 15 },
      { id: 13, name: "Matka Kulfi 100ml", rate: 40, boxUnits: 12 },
      { id: 14, name: "Vanilla Tub 500ml", rate: 96, boxUnits: 8 },
      { id: 15, name: "Butterscotch Tub 500ml", rate: 120, boxUnits: 8 }
    ];

    let orderState = {};
    let liveGPS = "15.63, 77.27";
    let isSelfieCaptured = false;
    let dutyActive = false;

    window.addEventListener('DOMContentLoaded', () => {
      renderProducts(products);
      refreshGPSLocation();
    });

    // Native Selfie Capture Preview & Button Unlock
    function previewSelfie(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          document.getElementById('selfieImg').src = e.target.result;
          document.getElementById('selfiePlaceholder').classList.add('hidden');
          document.getElementById('selfiePreviewBox').classList.remove('hidden');

          // Selfie Done -> Enable Punch IN Button
          isSelfieCaptured = true;
          const pIn = document.getElementById('punchInBtn');
          pIn.disabled = false;
          pIn.className = "bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl text-xs shadow transition active:scale-95 cursor-pointer";
        };
        reader.readAsDataURL(file);
      }
    }

    // Attendance Punch Lock/Unlock
    function handlePunch(type) {
      if (type === 'IN') {
        if (!isSelfieCaptured) {
          alert("Pehle selfie lena zaroori hai!");
          return;
        }
        dutyActive = true;
        document.getElementById('dutyBadge').innerText = "DUTY ACTIVE";
        document.getElementById('dutyBadge').className = "text-[10px] font-bold text-emerald-700 bg-emerald-50 px-2 py-0.5 rounded-full border border-emerald-300";
        
        // UNLOCK FULL APP
        document.getElementById('lockedAppContainer').classList.remove('opacity-30', 'pointer-events-none');
        
        document.getElementById('punchInBtn').disabled = true;
        document.getElementById('punchInBtn').className = "bg-slate-200 text-slate-400 font-bold py-3 rounded-xl text-xs shadow transition cursor-not-allowed";
        
        const pOut = document.getElementById('punchOutBtn');
        pOut.disabled = false;
        pOut.className = "bg-rose-600 hover:bg-rose-700 text-white font-bold py-3 rounded-xl text-xs shadow transition active:scale-95 cursor-pointer";
      } else {
        dutyActive = false;
        document.getElementById('dutyBadge').innerText = "DUTY ENDED";
        document.getElementById('dutyBadge').className = "text-[10px] font-bold text-slate-600 bg-slate-100 px-2 py-0.5 rounded-full border border-slate-300";
        
        // RE-LOCK APP
        document.getElementById('lockedAppContainer').classList.add('opacity-30', 'pointer-events-none');
        
        document.getElementById('punchOutBtn').disabled = true;
        document.getElementById('punchOutBtn').className = "bg-slate-200 text-slate-400 font-bold py-3 rounded-xl text-xs shadow transition cursor-not-allowed";
      }
    }

    function setActionType(type) {
      const bOrder = document.getElementById('btnTypeOrder');
      const bVisit = document.getElementById('btnTypeVisit');
      const orderSec = document.getElementById('orderBookingSection');
      const reasonSec = document.getElementById('noOrderReasonBox');

      if (type === 'order') {
        bOrder.className = 'py-2.5 rounded-xl border-2 border-amber-500 bg-amber-50 text-slate-900 font-bold text-xs flex items-center justify-center gap-1';
        bVisit.className = 'py-2.5 rounded-xl border-2 border-transparent bg-slate-100 text-slate-600 font-semibold text-xs flex items-center justify-center gap-1';
        orderSec.classList.remove('hidden');
        reasonSec.classList.add('hidden');
      } else {
        bVisit.className = 'py-2.5 rounded-xl border-2 border-blue-500 bg-blue-50 text-slate-900 font-bold text-xs flex items-center justify-center gap-1';
        bOrder.className = 'py-2.5 rounded-xl border-2 border-transparent bg-slate-100 text-slate-600 font-semibold text-xs flex items-center justify-center gap-1';
        orderSec.classList.add('hidden');
        reasonSec.classList.remove('hidden');
      }
    }

    function refreshGPSLocation() {
      const gpsTxt = document.getElementById('gpsStatusText');
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          pos => {
            liveGPS = `${pos.coords.latitude.toFixed(4)}, ${pos.coords.longitude.toFixed(4)}`;
            gpsTxt.innerText = liveGPS;
          },
          err => {
            liveGPS = "15.63, 77.27";
            gpsTxt.innerText = "15.63, 77.27 (Adoni)";
          }
        );
      } else {
        liveGPS = "15.63, 77.27";
        gpsTxt.innerText = "15.63, 77.27";
      }
    }

    function renderProducts(list) {
      const container = document.getElementById('productList');
      container.innerHTML = list.map(p => `
        <div class="pt-2 flex items-center justify-between">
          <div class="flex-1 pr-2">
            <h4 class="font-bold text-xs text-slate-900">${p.name}</h4>
            <div class="text-[10px] text-slate-500">Rate: ₹${p.rate} | Box: ${p.boxUnits} pcs</div>
          </div>
          <div class="flex items-center gap-2">
            <button type="button" onclick="updateQty(${p.id}, -1)" class="w-8 h-8 rounded-lg bg-slate-200 text-slate-800 font-bold text-base flex items-center justify-center active:scale-90">-</button>
            <span id="qty_${p.id}" class="w-6 text-center text-xs font-black">0</span>
            <button type="button" onclick="updateQty(${p.id}, 1)" class="w-8 h-8 rounded-lg bg-emerald-600 text-white font-bold text-base flex items-center justify-center active:scale-90">+</button>
          </div>
        </div>
      `).join('');
    }

    function filterProducts() {
      const q = document.getElementById('searchInput').value.toLowerCase();
      const filtered = products.filter(p => p.name.toLowerCase().includes(q));
      renderProducts(filtered);
      Object.keys(orderState).forEach(id => {
        const el = document.getElementById(`qty_${id}`);
        if (el) el.innerText = orderState[id];
      });
    }

    function updateQty(id, delta) {
      orderState[id] = (orderState[id] || 0) + delta;
      if (orderState[id] <= 0) delete orderState[id];

      const el = document.getElementById(`qty_${id}`);
      if (el) el.innerText = orderState[id] || 0;

      calculateTotals();
    }

    function calculateTotals() {
      let totalBoxes = 0;
      let totalGross = 0;

      Object.keys(orderState).forEach(id => {
        const p = products.find(x => x.id == id);
        const qty = orderState[id];
        totalBoxes += qty;
        totalGross += (qty * p.boxUnits * p.rate);
      });

      document.getElementById('totalBoxCount').innerText = totalBoxes;
      document.getElementById('grandTotal').innerText = Math.round(totalGross);
    }

    async function submitOrderToSheet() {
      const shop = document.getElementById('customShopName').value.trim();
      if (!shop) return alert("Pehle shop name daliye!");

      let totalBoxes = 0;
      let totalGross = 0;
      Object.keys(orderState).forEach(id => {
        const p = products.find(x => x.id == id);
        totalBoxes += orderState[id];
        totalGross += (orderState[id] * p.boxUnits * p.rate);
      });

      if (totalBoxes === 0) return alert("Kam se kam 1 box select karein!");

      const btn = document.getElementById('btnSyncOrder');
      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin text-lg"></i> Syncing...';

      const now = new Date();
      const pad = n => String(n).padStart(2, '0');
      const dateStr = `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}`;
      const timeStr = `${dateStr} ${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;

      const payload = {
        data: [{
          Timestamp: timeStr,
          Date: dateStr,
          Salesman: "E Balakrishna",
          Action: "Order",
          Shop_Name: shop,
          Boxes: totalBoxes,
          Sale_Amount: Math.round(totalGross),
          GPS_Location: liveGPS
        }]
      };

      try {
        const res = await fetch(SHEETDB_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (!res.ok) throw new Error("Sync Failed");

        alert("✅ Order RSM Google Sheet me save ho gaya!");
        orderState = {};
        renderProducts(products);
        calculateTotals();
        document.getElementById('customShopName').value = "";
      } catch(err) {
        alert("❌ SheetDB sync fail hua. Internet ya SheetDB link check karein.");
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-cloud-arrow-up text-lg"></i><span>Book & Sync to Live RSM</span>';
      }
    }

    async function submitVisitOnly() {
      const shop = document.getElementById('customShopName').value.trim();
      if (!shop) return alert("Shop name daliye!");

      const reason = document.getElementById('noOrderReason').value;
      const btn = document.getElementById('btnSyncVisit');
      btn.disabled = true;
      btn.innerHTML = '<
